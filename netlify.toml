[build]
  command = "pnpm --filter web build"
  publish = "packages/web/build"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# SPA fallback — Netlify serves existing files first, then falls back
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
